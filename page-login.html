<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandpAPP — Iniciar sesión</title>
  <link rel="stylesheet" href="assets/styles/styles2.css" />
</head>
<body id="page-login">
  <div class="frame">
    <form class="card" action="#" method="post" novalidate aria-labelledby="login-heading">
      <h1 id="login-heading" class="heading">Iniciar sesión</h1>

      <div class="logo" aria-hidden="true">GP</div>

      <label class="field">
        <span class="label">Correo electrónico</span>
        <input type="email" name="email" placeholder="correo@ejemplo.com" required />
      </label>

      <label class="field">
        <span class="label">Contraseña</span>
        <input type="password" name="password" placeholder="Contraseña" required />
        <button type="button" class="toggle-password">Mostrar contraseña</button>
      </label>

      <div class="row">
        <a class="link" href="#">Olvidé mi contraseña</a>
      </div>

      <button class="btn" type="submit">Ingresar</button>

      <p class="foot">¿No tienes cuenta? <a href="page-registro.html">Regístrate</a></p>
    </form>
  </div>

  <script src="assets/scripts/main.js" defer></script>
</body>
</html>
